services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: depot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: depot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "depot", "-d", "depot"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://depot:${POSTGRES_PASSWORD}@db:5432/depot?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: postgres://depot:${POSTGRES_PASSWORD}@db:5432/depot?sslmode=disable
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
